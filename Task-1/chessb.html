<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Responsive Chess Board</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    .chessboard {
      width: min(92vw, 700px);
      aspect-ratio: 1 / 1;
    }
    .square {
      aspect-ratio: 1 / 1;
    }
    .black {
      background-color: black;
    }
    .white {
      background-color: white;
    }
  </style>

</head>

<body>

  <!-- Full Screen Container -->
  <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">

    <!-- Chessboard -->
    <div class="chessboard border border-3 border-dark overflow-hidden">

      <!-- Row 1 -->
      <div class="row g-0">
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
      </div>

      <!-- Row 2 -->
      <div class="row g-0">
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
      </div>

      <!-- Row 3 -->
      <div class="row g-0">
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
      </div>

      <!-- Row 4 -->
      <div class="row g-0">
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
      </div>

      <!-- Row 5 -->
      <div class="row g-0">
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
      </div>

      <!-- Row 6 -->
      <div class="row g-0">
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
      </div>

      <!-- Row 7 -->
      <div class="row g-0">
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
      </div>

      <!-- Row 8 -->
      <div class="row g-0">
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
        <div class="col square white"></div>
        <div class="col square black"></div>
      </div>

    </div>
  </div>

</body>
</html>
